# HireMind 双版本一体化部署
#   启动:  docker compose up -d --build
#   查看日志: docker compose logs -f
#   停止:  docker compose down
#
# 两套应用彼此隔离:
#   - 第一版 studio:  http://localhost:3000  -> server:8000
#   - 第二版 frontend: http://localhost:3001 -> backend:8001
#   - API 文档: http://localhost:8000/docs（第一版）/ http://localhost:8001/docs（第二版）
#
# 运行时数据(模型配置 / 简历 / 会话)直接复用项目根的 .hiremind/ 目录,
# 通过 bind mount 挂载到容器内 /app/.hiremind,宿主机与容器共用同一份数据。

services:
  server:
    image: hiremind-server:latest
    build:
      # 后端需要 app/ 与 package/ 两部分代码,构建上下文为项目根
      context: .
      dockerfile: app/server/Dockerfile
    container_name: hiremind-server
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # 持久化模型配置、简历库、会话等运行时数据
      # 宿主路径 ./  相对 compose 文件解析(即项目根 .hiremind/)
      # 容器路径必须是绝对路径(对应 Dockerfile 里 WORKDIR /app + /app/.hiremind)
      - ./.hiremind:/app/.hiremind
      # 挂载源码,实现改完即生效(配合下方 --reload 热重载)
      # 容器内 /app/app 和 /app/package 被 bind mount 遮蔽,直接读宿主机代码
      - ./app:/app/app
      - ./package:/app/package
    # 覆盖 Dockerfile 的 CMD,加 --reload:文件变动后 uvicorn 自动重启
    command: ["python", "-m", "uvicorn", "app.server.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app", "--reload-dir", "/app/package"]
    environment:
      # 兜底配置(优先级低于 .hiremind/model_config.json,见 config.py)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - MODEL_NAME=${MODEL_NAME:-qwen3.7-plus}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  studio:
    image: hiremind-studio:latest
    build:
      context: app/studio
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=/api
        - BACKEND_URL=http://server:8000
    container_name: hiremind-studio
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=/api
      - BACKEND_URL=http://server:8000
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: hiremind-frontend:latest
    build:
      context: app/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE=/api
    container_name: hiremind-frontend
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - VITE_API_BASE=/api
      - VITE_BACKEND_PROXY=http://backend:8001
    # 镜像内运行 Vite，并由其把 /api 严格代理到第二版 backend。
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3001"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: hiremind-backend:latest
    build:
      context: app/backend
      dockerfile: Dockerfile
      additional_contexts:
        server_image: service:server
    container_name: hiremind-backend
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - DATABASE_URL=mysql+pymysql://hiremind:hiremind@mysql:3306/hiremind
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${HIREMIND_JWT_SECRET:-change-this-secret-before-production}
      - CORS_ORIGINS=http://localhost:3001,http://127.0.0.1:3001,http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:5173,http://localhost:5173
    volumes:
      - ./app/backend:/service
      - ./app/server:/app/app/server:ro
      - ./package:/app/package:ro
      - ./.hiremind:/legacy:ro
      - hiremind_service_state:/service-state
    tmpfs:
      - /runtime/users
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: hiremind-mysql
    environment:
      MYSQL_DATABASE: hiremind
      MYSQL_USER: hiremind
      MYSQL_PASSWORD: hiremind
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hiremind-root}
    volumes:
      - hiremind_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-hiremind-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hiremind-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hiremind_redis:/data
    restart: unless-stopped

volumes:
  hiremind_service_state:
  hiremind_mysql:
  hiremind_redis:
